plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.rajos.android'

    compileSdk 34

    defaultConfig {
        applicationId "com.rajos.android"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Enable Hermet for faster rebuilds
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            togetherWith release {}
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Configure notification channels for Android O+
    defaultConfig {
        targetSandboxVersion 3
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.14.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // Firebase Messaging for push notifications
    implementation 'com.google.firebase:firebase-messaging:23.3.0'

    // WorkManager for background scheduling
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // AndroidX legacy
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.0'

    // Room for local database (if needed)
    implementation 'androidx.room:room-ktx:2.5.0'
    implementation 'com.h2database:h2:2.2.224'

    // Timber for logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Coil for image loading (if needed)
    implementation 'androidx.coil:coil-compose:2.3.0'
}