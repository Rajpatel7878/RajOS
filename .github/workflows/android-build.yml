name: Android CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-android:

    runs-on: windows-latest

    steps:
      - name: Cancel any in-progress jobs
        if: cancellationRequested()
        run: echo "Job cancellation requested"

    # ---------------------------------------------------
    # 1. Check out the repository
    # ---------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------------------------------------------
    # 2. Set up JDK 17 (required for Kotlin 1.7+)
    # ---------------------------------------------------
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ---------------------------------------------------
    # 3. Configure Android SDK
    # ---------------------------------------------------
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        # The Android SDK is automatically available at ANDROID_HOME

    # ---------------------------------------------------
    # 4. Accept Android licenses
    # ---------------------------------------------------
    - name: Accept Android licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    # ---------------------------------------------------
    # 5. Install required Android packages
    # ---------------------------------------------------
    - name: Install Android SDK packages
      run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
        "platforms;android-34" \
        "platforms;build-tools;34.0.0" \
        "platform-tools" \
        "cmdline-tools;latest"

    # ---------------------------------------------------
    # 6. Grant required permissions for Android studio
    # ---------------------------------------------------
    - name: Grant permissions
      run: |
        chmod +x $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
        chmod +x $ANDROID_HOME/platform-tools/adb.exe

    # ---------------------------------------------------
    # 7. Build the Android debug APK (no signing credentials needed)
    # ---------------------------------------------------
    - name: Assemble Android debug APK
      # The existing build.gradle should work with this
      run: |
        ./gradlew :app:assembleDebug --stacktrace

    # ---------------------------------------------------
    # 8. Run unit tests (if any)
    # ---------------------------------------------------
    - name: Run unit tests
      run: |
        ./gradlew test --stacktrace --info 2>&1 | tail -50 || echo "Tests completed with exit code $?"

    # ---------------------------------------------------
    # 9. Run lint checks
    # ---------------------------------------------------
    - name: Run Lint
      run: |
        ./gradlew lint --stacktrace --info 2>&1 | tail -50 || echo "Lint completed with exit code $?"

    # ---------------------------------------------------
    # 10. Upload APK as artifact
    # ---------------------------------------------------
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: rajos-android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    # ---------------------------------------------------
    # 11. Report build status
    # ---------------------------------------------------
    - name: Report build status
      run: |
        echo "Build completed"
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "APK not found"